# 重要ニュース週刊ダイジェストの選定・生成の月次見直しワークフロー
# (仕様: specs/news-digest/monthly-review/design.md「実行環境の前提」「見直しの材料を集める処理」
# 「見直し案を作成する処理」「見直し案をPRとして提案する処理」)
#
# collectReviewData.tsで直近1ヶ月の専用枠の基準未達記録・フィードバックを集計し、Claude Code CLIを
# ヘッドレス起動して見直し案の検討・ファイル編集を行わせる。見直し対象は選定領域(情報源・採用基準・
# 専用枠の運用)と生成領域(要約・記事執筆ルール)の両方で、各フィードバックはエージェントが内容から
# 選定/生成/対象外に振り分ける。変更があればブランチ作成・コミット・push・PR作成まで行うが、
# weekly-publishと異なり自動マージはしない(通常のレビュー必須フローのまま。requirements.md#承認フロー-5参照)
name: 重要ニュース週刊ダイジェスト 選定・生成の月次見直し

on:
  schedule:
    - cron: '30 22 1 * *' # 毎月1日22:30 UTC = 2日07:30 JST(ai-dev-digest 07:00・weekly-publish 06:17とずらし利用枠の競合時間帯を分散させる)
  workflow_dispatch: # Secrets設定後の動作確認用に手動実行できるようにする

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # GitHub書き込みはweekly-publishと同じ専用PATを使う(design.md「実行環境の前提」参照)
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.NEWS_DIGEST_GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # ci.yml・deploy.ymlと同じバージョンに揃える
          cache: 'npm'

      - run: npm ci

      - name: 集計対象期間(直近1ヶ月)の開始日を算出
        id: since
        run: echo "date=$(date -u -d '-1 month' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # 依存関係(pg/dotenv)を本体package.jsonから隔離した独立パッケージのため、専用にnpm installする
      # (design.md「関連するファイル」、ai-dev-digest/collect-review-dataと同じ隔離パターン)。フィードバックは
      # 領域で絞り込まず全件取得する(振り分けは後続のヘッドレスClaude Codeの推論。design.md「見直しの
      # 材料を集める処理」手順2)
      - name: 専用枠の基準未達記録・フィードバックを収集
        working-directory: scripts/news-digest/collect-review-data
        run: |
          npm install
          npx tsx collectReviewData.ts "${{ steps.since.outputs.date }}" > /tmp/review-data.json
        env:
          SUPABASE_READONLY_DB_URL: ${{ secrets.SUPABASE_READONLY_DB_URL }}

      - name: Claude Code CLIをインストール
        run: npm install -g @anthropic-ai/claude-code

      # 見直し案の検討はエージェントの推論に委ねる(design.md「見直し案を作成する処理」)。
      # プロンプトはrequirements.md/design.mdをそのまま参照させる指示のみとし、内容を複製しない。
      # 認証はweekly-publishと共用のClaude Code Pro/Maxサブスクリプション認証を使う
      # (design.md「実行環境の前提」参照)
      - name: 見直し案を検討・ファイルへ反映(材料が両方0件ならファイルは変わらない)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat <<'PROMPT'
          あなたはこのリポジトリのnews-digestアプリの月次見直し担当です。
          specs/news-digest/monthly-review/requirements.md と design.md を読み、
          「見直し案を作成する処理」の手順に従って選定領域・生成領域の見直し案を検討してください。

          見直し対象の仕様は次のとおりです:
          - 選定領域: specs/news-digest/content-selection/requirements.md と design.md、
            機械可読データ content/news-digest/watchlist.json と content/news-digest/criteria.json
          - 生成領域: specs/news-digest/content-generation/requirements.md と design.md

          見直しの材料(直近1ヶ月の専用枠の基準未達記録・運営者フィードバック)は /tmp/review-data.json に
          JSON形式で保存されています。読み込んで判断材料にしてください。フィードバックは領域で絞り込まれて
          いない全件です。

          # フィードバックの振り分け(requirements.md#見直しの実行-3〜4)
          各運営者フィードバックを内容から「選定領域」「生成領域」「いずれにも該当しない」に振り分けて
          ください(判断の目安は design.md「見直し案を作成する処理」手順1)。1件が両領域に関係する場合は
          両方の見直し案の根拠にしてかまいません。いずれにも該当しないもの(画面表示の不具合、
          フィードバック・付箋など他機能への要望)は見直し案に含めず、PR本文の判断材料の表にその内容と
          「対象外」である旨を行として記録してください。

          # 選定領域の見直し案
          専用枠(神奈川ローカル・育児)の基準未達記録と選定領域に振り分けたフィードバックをもとに
          検討します。専用枠の基準未達が特定の情報源で慢性的に続いている場合はその情報源の見直しを、
          総合・経済/ビジネスの候補が慢性的に0件のカテゴリがあれば情報源の追加や採用基準
          (minCorroboratingSources)の見直しを検討してください。既存の情報源の除外・既存の数値基準
          (閾値)の調整だけでなく、新しい採用基準・フィルター観点の追加提案も対象に含みます
          (requirements.md#選定領域の見直し案の粒度・提示方法-6)。
          変更する場合は、specs/news-digest/content-selection/requirements.md と
          content/news-digest/watchlist.json・content/news-digest/criteria.json を
          必ずすべて更新してください(一部だけの更新はしないでください)。

          content-selection/requirements.mdに、既存の選定ロジック(app/news-digest/lib/selection.ts等)
          ではまだ判定できない新しい種類の採用基準・フィルター観点を追加する場合、その判定ロジックの
          実装(TDDのテストを含む)も同じコミットに含めてください。仕様の変更だけを残し、実装を
          先送りにしないでください(既存の実装済み項目に対する変更(閾値の調整・情報源の除外等)の
          みの場合、この対応は不要です)。実装ファイルはapp/news-digest/lib/配下、テストファイルは
          __tests__/news-digest/lib/配下に置いてください(選定ロジックはこの範囲にのみ存在します。
          画面表示のコンポーネント等、他の範囲は変更しないでください)(requirements.md#選定領域の
          見直し案の粒度・提示方法-8)。

          どうしても実装まで完了できない場合(判定方法自体にさらなる検討が必要な場合等)に限り、
          scripts/spec-coverage-skip.jsonの配列に以下の形式でエントリを追加し、判断材料の表
          (下記)に実装が未完了である旨を明記してください。これは例外的な扱いです:
          {"specFile": "news-digest/content-selection/requirements.md", "item": "<追加した見出し名> [<番号>]", "reason": "見直し案として提案中で判定方法の設計・実装が未確定のため"}
          itemの値は、追加した見出し(### で始まる行)のテキストと箇条書きの番号を「見出し名 [番号]」の
          形式でそのまま使ってください。

          # 生成領域の見直し案(requirements.md#生成領域の見直し案の粒度・提示方法-9〜10)
          生成領域に振り分けたフィードバックがある場合、記事の分かりやすさ・情報の取捨選択・重要度の
          付け方の問題に対し、specs/news-digest/content-generation/requirements.md の機能要件・
          ビジネスルール(要約の分量、固定4観点の構成・内容、重要度の基準、書き出しの順序など)と
          specs/news-digest/content-generation/design.md の該当処理の文言を、具体的な変更案
          (実際のファイル差分)として作成してください。

          変更は既存ルールの調整(数値・順序・観点の言い換え)にとどめてください。
          content-generation/requirements.md の「### 著作権への配慮(根拠)」が定める著作権リスク低減の
          緩和策(原文の構成をなぞらない独自の再構成、数値・結論の網羅的な転記の回避、出典の明記)を
          弱める変更は提案しないでください(requirements.md#ビジネスルール・制約-3)。この著作権ガードに
          抵触するため採用できない要望(例:「要約が浅いので原文の数値を全部載せてほしい」等)は
          見直し案に反映せず、却下した旨と理由をPR本文の判断材料の表の行として残してください。

          content-generation/requirements.md・design.md の変更は、記事生成CLI
          (scripts/news-digest/generate-content.ts)が実行時に両ファイルを読み込むため次回の週次生成に
          自動で反映されます。ただし変更が同CLI内に転記されているルール文に及ぶ場合は、その転記箇所の
          更新も同じコミットに含めてください。

          # 材料が1件でもあれば必ず具体案を出す
          選定領域・生成領域それぞれについて、振り分けた材料(選定領域は専用枠の基準未達記録も含む)が
          1件でもある場合は、必ず具体的な変更案(実際のファイル差分)を作成してください。「1件では
          根拠が薄い」「単発のため見送り」といった理由で提案自体を見送り、無言で終了することは禁止
          します(requirements.md#選定領域の見直し案の粒度・提示方法-7、requirements.md#生成領域の
          見直し案の粒度・提示方法-9)。両領域とも材料が0件の場合のみ、一切のファイルを変更せず
          終了してください。

          # 実装後の確認
          ファイルを変更した場合は、コミット前に必ず以下をすべて実行し、成功することを確認してください:
          npm test / npm run lint / npm run build / npm run check:spec-coverage

          # 判断材料の表
          変更した場合、または対象外・却下の行がある場合は、判断材料の表(「対象フィードバック・実績」
          「提案内容」「適用した場合の懸念」の3列。1行が1つの見直し観点・対象外・却下に対応し、
          複数を検討した場合は複数行にする)をMarkdown形式で /tmp/news-digest-monthly-review-pr-body.md に
          書き出してください。

          ブランチ作成・コミット・PR作成は行わず、対象ファイルの編集だけを行ってください
          (それらは後続のステップが行います)。
          PROMPT
          )" --dangerously-skip-permissions

      # 変更検知・git addの対象パス(design.md「関連するファイル」「見直し案を作成する処理」変更対象ファイル):
      # - 選定領域: content-selection/requirements.md・watchlist.json・criteria.json。新しい判定ロジックの
      #   実装(手順6)がapp/news-digest/lib・__tests__/news-digest/libのどのファイルに及ぶかは提案
      #   内容によって変わるため、個別ファイルの列挙ではなくディレクトリ単位で対象を指定する
      #   (ai-dev-digest-monthly.ymlと同じ設計判断。選定ロジックはlib/配下にのみ存在するため、
      #   components/・[date]/等の画面コードは対象に含めない)
      # - 生成領域: content-generation配下(requirements.md・design.md)と、転記箇所に及ぶ場合の
      #   scripts/news-digest/generate-content.ts(design.md「見直し案を作成する処理」手順8)
      - name: 変更の有無を確認
        id: diff
        run: |
          if git diff --quiet -- \
            specs/news-digest/content-selection/requirements.md \
            content/news-digest/watchlist.json \
            content/news-digest/criteria.json \
            scripts/spec-coverage-skip.json \
            app/news-digest/lib \
            __tests__/news-digest/lib \
            specs/news-digest/content-generation \
            scripts/news-digest/generate-content.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # このPRは自動マージしない(design.md「見直し案をPRとして提案する処理」手順3。
      # news-digest/monthly-review/**ブランチはweekly-publishの自動マージ対象外)
      - name: ブランチ作成・コミット・PR作成
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.NEWS_DIGEST_GH_PAT }}
        run: |
          YEAR_MONTH=$(date -u +%Y-%m)
          BRANCH="news-digest/monthly-review/${YEAR_MONTH}"
          git config user.name "news-digest-bot"
          git config user.email "news-digest-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add \
            specs/news-digest/content-selection/requirements.md \
            content/news-digest/watchlist.json \
            content/news-digest/criteria.json \
            scripts/spec-coverage-skip.json \
            app/news-digest/lib \
            __tests__/news-digest/lib \
            specs/news-digest/content-generation \
            scripts/news-digest/generate-content.ts
          git commit -m "spec(news-digest): ${YEAR_MONTH}の選定・生成の見直し"
          git push origin "$BRANCH"

          # 判断材料の表(design.md「見直し案をPRとして提案する処理」手順2)。Claude Codeが
          # 書き出さなかった場合のフォールバックとして、最低限の案内文を用意する
          # (design.md「エラーハンドリング」3点目)
          BODY_FILE=/tmp/news-digest-monthly-review-pr-body.md
          if [ ! -s "$BODY_FILE" ]; then
            echo "月次見直しワークフローが生成した提案です(判断材料の表の書き出しに失敗したため詳細はコミット・差分を参照してください)。このPRは自動マージされません。運営者が内容を確認のうえマージしてください。" > "$BODY_FILE"
          else
            echo "" >> "$BODY_FILE"
            echo "---" >> "$BODY_FILE"
            echo "このPRは自動マージされません。運営者が内容を確認のうえマージしてください。" >> "$BODY_FILE"
          fi

          gh pr create --base main \
            --title "[news-digest] ${YEAR_MONTH}の選定・生成の見直し" \
            --body-file "$BODY_FILE"
