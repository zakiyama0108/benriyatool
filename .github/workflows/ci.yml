# PR作成時にlint/test/buildを実行し、CLAUDE.mdの「PRを出す前にCIを確認する」を実効化するワークフロー
name: CI

on:
  # mainへのPRが作成・更新された時にのみ実行(mainへのpushはdeploy.ymlが担当)
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # deploy.ymlと同じバージョンに揃える
          cache: 'npm'

      # package-lock.jsonの内容通りに依存関係をクリーンインストール(npm installと違い再現性がありCI向き)
      - run: npm ci

      # eslint.config.mjsのルール(Next.js推奨ルール+no-console等)を全ファイルに適用
      - run: npm run lint

      # __tests__/配下のテストをvitest.config.mtsの設定で実行し、行/分岐カバレッジも計測する。
      # 閾値は設定していないため数値が低くてもCIは落ちない(可視化のみ、ログで実測値を確認する用途)
      - run: npm run test:coverage

      # requirements.md/design.mdの各仕様項目(見出し・箇条書きID)にテストが紐づいているかを検証。
      # テスト不要な項目はscripts/spec-coverage-skip.jsonに理由付きで登録する運用のため、
      # ここで❌が残っている場合は「テストを書く」か「理由を添えてスキップ登録する」のどちらかが必要
      - run: npm run check:spec-coverage

      # next.config.ts・tsconfig.json(strict: true)に基づくビルド。型エラーもここで検出される。
      # ビルドが通ることまで確認し、mainマージ後のデプロイ失敗を未然に防ぐ
      - run: npm run build
