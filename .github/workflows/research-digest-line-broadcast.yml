# 週刊研究発見(research-digest)のLINE公式アカウント新着記事自動配信ワークフロー
# (仕様: specs/research-digest/line-broadcast/design.md「実行環境の前提」「配信対象の記事を決める
# 処理」「配信する処理」)
#
# weekly-publish(research-digest-weekly.yml)のPRがmainへ自動マージされた結果として発生する
# pushをそのまま起動条件にする(auto-mergeのタイミングはpublishジョブの実行中には確定しないため、
# publishジョブの内部からは待ち受けられない。design.md「実行環境の前提」参照)。
# 新規追加(Added)された記事ファイルのみを配信対象とし、既存記事の内容変更では配信しない
# (過去記事の再配信防止。requirements.md#配信タイミング・方式-9)。
#
# trend-digest-line-broadcast.ymlと同じ実装パターンで、同じLINE公式アカウント・
# チャネルアクセストークン(LINE_CHANNEL_ACCESS_TOKEN)に相乗りする(新規Secretは作らない。
# design.md「実行環境の前提」)
name: 週刊研究発見 LINE配信

on:
  push:
    branches: [main]
    paths:
      - 'content/research-digest/articles/*.json'
  workflow_dispatch: # Secrets設定後・トラブル時の動作確認用に手動実行できるようにする
    inputs:
      id:
        description: '配信対象の記事ID(<発行日YYYY-MM-DD>-<edition>形式。例: 2026-10-05-body-life)'
        required: true

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # push直前のコミット(github.event.before)との差分を取るため、履歴全体を取得する
          # (浅いcloneだとevent.beforeのコミットがローカルに存在せずdiffが失敗するため)
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # 他ワークフローと同じバージョンに揃える
          cache: 'npm'

      - run: npm ci

      # 配信対象IDを判定する(design.md「配信対象の記事を決める処理」手順1〜3)。
      # workflow_dispatchは入力されたIDをそのまま使い、pushイベントはgit diffで新規追加
      # (Added)された記事ファイルのみを対象にする(既存ファイルの変更(Modified)は対象外)
      - name: 配信対象IDを判定
        id: target
        env:
          # ${{ inputs.id }}をrun:に直接埋め込まずenv経由で渡す(シェルインジェクション対策)
          INPUT_ID: ${{ inputs.id }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if ! echo "$INPUT_ID" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}-(body-life|science-society)$'; then
              echo "::error::記事IDの形式が不正です(<YYYY-MM-DD>-<body-life|science-society>形式で指定してください): $INPUT_ID"
              exit 1
            fi
            ids="$INPUT_ID"
          else
            added=$(git diff --name-status "${{ github.event.before }}" "${{ github.sha }}" -- 'content/research-digest/articles/*.json' | awk '$1 == "A" {print $2}')
            if [ -z "$added" ]; then
              echo "新規追加された記事ファイルがないため、配信をスキップします"
              ids=""
            else
              ids=$(echo "$added" | xargs -n1 basename | sed 's/\.json$//' | tr '\n' ' ')
            fi
          fi
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

      # 複数件見つかった場合も、1件の失敗が他のIDの処理を止めないようにする(design.md
      # 「配信対象の記事を決める処理」手順2は基本的に1件想定だが、trend-digestと同じ堅牢さを保つ)。
      # `run:`はデフォルトで`bash -eo pipefail`実行のため、`if !`で各コマンドの終了コードを
      # 個別に受け止めて-eによる即終了を避け、ループ完了後にまとめてステップを失敗させる
      - name: LINEへ配信
        if: steps.target.outputs.ids != ''
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          # ${{ steps.target.outputs.ids }}もrun:に直接埋め込まずenv経由で渡す
          TARGET_IDS: ${{ steps.target.outputs.ids }}
        run: |
          failed=0
          for id in $TARGET_IDS; do
            echo "配信します: $id"
            if ! npx tsx scripts/research-digest/broadcast-line.ts "content/research-digest/articles/${id}.json"; then
              echo "::error::${id}の配信に失敗しました"
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then
            exit 1
          fi
