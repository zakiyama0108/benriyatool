# Supabase無料プランはAPIアクセスが一定期間(目安1週間)ないと自動的に一時停止されるため、
# 週次でREST APIに軽いリクエストを送り、プロジェクトを起動状態に保つワークフロー
# (背景: docs/adr/0001-user-input-database.md の懸念点)
name: Supabase Health Check

on:
  schedule:
    # 毎週月曜 9:00 JST(00:00 UTC)に実行
    - cron: '0 0 * * 1'
  # 動作確認のため手動実行もできるようにする
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # apikeyヘッダーのみだと認証エラー(401)にはなるが、APIサーバーに到達すればpingとしては十分。
      # 接続自体ができない場合はhttp_codeが000になるため、それだけを失敗として扱う
      - name: Ping Supabase REST API
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}")
          echo "status: $status"
          if [ "$status" = "000" ]; then
            echo "Supabaseに接続できませんでした"
            exit 1
          fi
