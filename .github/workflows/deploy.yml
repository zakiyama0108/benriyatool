# mainにマージされた後、DBマイグレーション適用 → 本番のCloudflare Workersへ自動デプロイするワークフロー
# PR段階のlint/testはci.ymlが担当するため、ここではmigrate/build/deployのみ行う。
# ただしci.ymlはPRごとに変更影響テストのみを実行するため(ADR-0008)、mainへの反映経路のどこかで
# 全テストを一度は通す必要があり、deployジョブのビルド前にフルスイートを実行する
name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  # Secrets設定後の動作確認用(migrate→deployを手動実行できる。デプロイは同じ内容の再配信になるだけで安全)
  workflow_dispatch:

jobs:
  # supabase/migrations/ の未適用SQLを本番DBへ適用する(背景: docs/adr/0003-db-schema-migration-ci.md)
  # 適用済みはDB内の管理テーブルで判定されるため、毎回実行しても二重適用されない(未適用がなければ即終了)
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # SUPABASE_DB_URLはSession PoolerのURI(セッションモード・ポート5432)。
      # GitHub ActionsランナーはIPv6不可のため、IPv4対応のPooler経由で接続する(直接続はIPv6のみ)
      - name: Apply migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  deploy:
    # 新コードが前提とするスキーマ変更を先に適用してからデプロイする(順序逆転するとINSERT失敗が握りつぶされて気づけない)
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # ci.ymlと同じバージョンに揃える
          cache: 'npm'

      # package-lock.jsonの内容通りに依存関係をクリーンインストール(npm installと違い再現性がありCI向き)
      - run: npm ci

      # ci.ymlのtestジョブはPRごとの変更影響テストのみ(ADR-0008)なので、mainへの反映直前で
      # 全テストを一度通しておく(fetch-depth: 0によるgit diff取得が不要な分、通常のtest:coverageを使う)
      - run: npm run test:coverage

      # next.config.ts・tsconfig.json(strict: true)に基づくビルド。ci.ymlで通過済みだがデプロイ用に再実行する。
      # NEXT_PUBLIC_*は静的エクスポート時にビルド成果物へ埋め込まれる値のため、ビルドステップでのみ渡す
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # wrangler.tomlの設定(workers_dev: false等)に従い、Cloudflare Workersへ静的配信としてデプロイ
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
