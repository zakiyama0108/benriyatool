# 重要ニュース週刊ダイジェストの週次記事生成・公開ワークフロー
# (仕様: specs/news-digest/weekly-publish/design.md「実行環境の前提」「1週分の記事を生成する処理」
# 「PRを作成しCIの結果を待つ処理」「PRを自動マージする処理」「CI失敗時に記録する処理」)
#
# publishジョブ: 週1回(毎週水曜JST)、候補収集・採用基準判定→候補ごとの要約生成→記事データ組み立て→
# PR作成→auto-merge有効化までを行う。news-digest/articles/**ブランチからのPRに限り、CIが成功すると
# 人間の承認なしに自動マージされる(通常のfeatureブランチのレビュー必須運用の例外。
# 根拠はrequirements.md#公開フロー-4参照。ai-dev-digestのdaily-publishと同じ運用)
#
# record-ci-failureジョブ: 上記PRのCI(ci.yml)が失敗した場合、マージせず原因をPRコメントに記録する
name: 重要ニュース週刊ダイジェスト 週次記事公開

on:
  schedule:
    # 毎時0分は世界中のscheduled workflowが集中し起動遅延が大きくなるため、0分を避けた17分に設定する
    # (ai-dev-digestの日次実行(06:43 JST)の実測知見を踏襲し、0分を避ける。design.md「実行環境の前提」参照。
    # ai-dev-digest/trend-digestの週次・月次実行と起動時刻をずらし、利用枠の競合時間帯を分散させる)
    - cron: '17 21 * * 2' # 火曜21:17 UTC = 水曜06:17 JST
  workflow_dispatch: # Secrets設定後の動作確認用に手動実行できるようにする
  workflow_run:
    workflows: ['CI']
    types: [completed]

jobs:
  publish:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      # GitHub書き込みは既定のGITHUB_TOKENではなく専用PATを使う(既定トークンで作成したPR・pushは
      # 無限ループ防止のGitHub側の仕様により後続ワークフロー(ci.yml)が自動起動されないため)
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.NEWS_DIGEST_GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # ci.yml・deploy.ymlと同じバージョンに揃える
          cache: 'npm'

      - run: npm ci

      # 収集・選定(グループ化・採用基準判定)・要約生成がいずれもヘッドレス起動するために必要
      # (design.md「実行環境の前提」)
      - name: Claude Code CLIをインストール
        run: npm install -g @anthropic-ai/claude-code

      - name: 実行日(JST)を算出
        id: date
        run: echo "value=$(TZ='Asia/Tokyo' date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: 作業用ブランチを作成
        run: git checkout -b "news-digest/articles/${{ steps.date.outputs.value }}"

      - name: 候補収集・グループ化・採用基準判定(content-selection)
        run: npx tsx scripts/news-digest/collect-and-select.ts "${{ steps.date.outputs.value }}" > /tmp/selection.json
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      # 候補不足時はブランチ・PRを作成せずスキップする(requirements.md#掲載件数の保証-1、
      # content-selection/requirements.md#1週あたりの掲載件数-7参照)
      - name: 候補不足によるスキップ判定
        id: selection
        run: |
          status=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/selection.json','utf8')).status)")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = "skipped" ]; then
            reason=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/selection.json','utf8')).reason)")
            echo "候補不足によりスキップします: $reason"
          else
            # PR本文に載せる選定件数・基準未達件数(design.md「PRを作成しCIの結果を待つ処理」手順1)
            topicsCount=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/selection.json','utf8')).topics.length)")
            belowCriteriaCount=$(node -e "const r=JSON.parse(require('fs').readFileSync('/tmp/selection.json','utf8'));console.log(r.topics.filter((t) => t.belowCriteria).length)")
            echo "topicsCount=$topicsCount" >> "$GITHUB_OUTPUT"
            echo "belowCriteriaCount=$belowCriteriaCount" >> "$GITHUB_OUTPUT"
          fi

      # 選定された候補ごとにgenerate-content.tsをヘッドレス起動する(design.md「1週分の記事を生成する処理」
      # 手順4)。1候補あたり最大2回(初回+リトライ1回)の試行はgenerate-content.ts自身が行うため、
      # ここでは候補ごとに1回呼ぶだけでよい。終了コードで失敗理由を区別する:
      # - exit 1(1候補だけの単純な失敗): content: nullとして記録し、assembleArticle(write-article.ts経由)が
      #   topicsから除外する(requirements.md#掲載件数の保証-2)
      # - exit 2(利用枠の枯渇。generate-content.tsのisQuotaExhaustionErrorが検知): リトライしても回復しないため、
      #   ループを打ち切りジョブ全体を失敗させる。以降の記事データ組み立て・PR作成ステップは
      #   `if: steps.selection.outputs.status == 'ok'`の暗黙のsuccess()判定によりスキップされ、
      #   記事は公開されない(requirements.md#掲載件数の保証-2、design.md「エラーハンドリング」)
      # Anthropic APIの従量課金ではなく、運営者個人のClaude Code Pro/Maxサブスクリプション認証
      # (CLAUDE_CODE_OAUTH_TOKEN)でヘッドレス実行する(design.md「実行環境の前提」)
      - name: 候補ごとの要約生成(content-generation)・記事データ入力への集約
        if: steps.selection.outputs.status == 'ok'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "[]" > /tmp/inputs.json
          count=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/selection.json','utf8')).topics.length)")
          for i in $(seq 0 $((count - 1))); do
            exit_code=0
            npx tsx scripts/news-digest/generate-content.ts /tmp/selection.json "$i" > "/tmp/generated-$i.json" || exit_code=$?
            if [ "$exit_code" -eq 2 ]; then
              echo "候補${i}で利用枠の枯渇を検知したため、この週の実行を打ち切ります(記事は公開しません)"
              exit 1
            fi
            if [ "$exit_code" -ne 0 ]; then
              echo "候補${i}の生成に失敗したため、この候補は除外します"
              echo "null" > "/tmp/generated-$i.json"
            fi
            node -e "
              const fs = require('fs');
              const selection = JSON.parse(fs.readFileSync('/tmp/selection.json', 'utf8'));
              const candidate = selection.topics[$i];
              const content = JSON.parse(fs.readFileSync('/tmp/generated-$i.json', 'utf8'));
              const inputs = JSON.parse(fs.readFileSync('/tmp/inputs.json', 'utf8'));
              inputs.push({ candidate, content });
              fs.writeFileSync('/tmp/inputs.json', JSON.stringify(inputs, null, 2));
            "
          done

      - name: 記事データの組み立て・書き出し
        if: steps.selection.outputs.status == 'ok'
        run: npx tsx scripts/news-digest/write-article.ts "${{ steps.date.outputs.value }}" /tmp/inputs.json

      - name: コミット・push・PR作成・自動マージ有効化
        if: steps.selection.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ secrets.NEWS_DIGEST_GH_PAT }}
        run: |
          git config user.name "news-digest-bot"
          git config user.email "news-digest-bot@users.noreply.github.com"
          git add "content/news-digest/articles/${{ steps.date.outputs.value }}.json"
          git commit -m "content(news-digest): ${{ steps.date.outputs.value }}週の重要ニュースを公開"
          git push origin "news-digest/articles/${{ steps.date.outputs.value }}"
          gh pr create --base main \
            --title "[news-digest] ${{ steps.date.outputs.value }}週の重要ニュースを公開" \
            --body "週次自動生成PRです。選定件数: ${{ steps.selection.outputs.topicsCount }}件(うち基準未達: ${{ steps.selection.outputs.belowCriteriaCount }}件)。CIが成功すると人間の承認なしに自動的にmainへマージされます(specs/news-digest/weekly-publish/design.md参照)。"
          gh pr merge --auto --squash "news-digest/articles/${{ steps.date.outputs.value }}"

  # publishが作成したPRのCI(ci.yml)が失敗した場合、マージせず原因をPRコメントに記録する
  # (design.md「CI失敗時に記録する処理」)。news-digest/articles/**ブランチ由来のPR以外は対象外
  # (monthly-reviewが作成するnews-digest/monthly-review/**ブランチのPRは通常どおりレビュー必須のまま残す)
  record-ci-failure:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && startsWith(github.event.workflow_run.head_branch, 'news-digest/articles/')
    runs-on: ubuntu-latest
    # リポジトリ既定のworkflow permissions(現状read)が将来変わっても、失敗ジョブ・ステップ特定
    # (gh run view --json jobs)に必要な読み取り権限を確実に持てるよう明示する
    permissions:
      actions: read
    steps:
      # どのチェックが失敗したかを特定する(design.md「CI失敗時に記録する処理」手順2)。
      # actions:readで足りる読み取り専用の問い合わせのため、書き込み専用のNEWS_DIGEST_GH_PATではなく
      # 既定のGITHUB_TOKEN(同一リポジトリのActions実行結果を読む既定権限を持つ)を使う
      - name: 失敗したジョブ・ステップを特定
        id: failure-detail
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          detail=$(gh run view "${{ github.event.workflow_run.id }}" --repo "${{ github.repository }}" --json jobs \
            --jq '[.jobs[] | select(.conclusion=="failure") as $job | $job.steps[] | select(.conclusion=="failure") | "\($job.name) > \(.name)"] | join(", ")')
          if [ -z "$detail" ]; then
            detail="(失敗ステップの詳細は取得できませんでした)"
          fi
          echo "detail=$detail" >> "$GITHUB_OUTPUT"

      - name: 失敗したPRにコメントを追記
        env:
          GH_TOKEN: ${{ secrets.NEWS_DIGEST_GH_PAT }}
        run: |
          PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" \
            --head "${{ github.event.workflow_run.head_branch }}" \
            --state open --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
              --body "CI(${{ github.event.workflow_run.name }})が失敗しました。失敗したチェック: ${{ steps.failure-detail.outputs.detail }}。マージは行われません。詳細: ${{ github.event.workflow_run.html_url }}"
          else
            echo "対象のPRが見つかりませんでした(既にクローズ済みの可能性があります): ${{ github.event.workflow_run.head_branch }}"
          fi
