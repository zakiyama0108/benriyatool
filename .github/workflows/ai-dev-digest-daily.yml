# AI駆動開発ダイジェストの日次記事生成・公開ワークフロー
# (仕様: specs/ai-dev-digest/daily-publish/design.md「実行環境の前提」「1日分の記事を生成する処理」
# 「PRを作成しCIの結果を待つ処理」「PRを自動マージする処理」「CI失敗時に記録する処理」)
#
# publishジョブ: 1日1回、候補収集→翻訳・要約生成→記事データ組み立て→PR作成→auto-merge有効化までを行う。
# ai-dev-digest/articles/**ブランチからのPRに限り、CIが成功すると人間の承認なしに自動マージされる
# (通常のfeatureブランチのレビュー必須運用の例外。根拠はrequirements.md#公開フロー-4参照)
#
# record-ci-failureジョブ: 上記PRのCI(ci.yml)が失敗した場合、マージせず原因をPRコメントに記録する
name: AI駆動開発ダイジェスト 日次記事公開

on:
  schedule:
    - cron: '0 22 * * *' # 毎日22:00 UTC = 07:00 JST(実行日はJSTの日付を使う)
  workflow_dispatch: # Secrets設定後の動作確認用に手動実行できるようにする
  workflow_run:
    workflows: ['CI']
    types: [completed]

jobs:
  publish:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      # GitHub書き込みは既定のGITHUB_TOKENではなく専用PATを使う(既定トークンで作成したPR・pushは
      # 無限ループ防止のGitHub側の仕様により後続ワークフロー(ci.yml)が自動起動されないため)
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AI_DEV_DIGEST_GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # ci.yml・deploy.ymlと同じバージョンに揃える
          cache: 'npm'

      - run: npm ci

      # 翻訳・要約生成(下記)がヘッドレス起動するために必要(design.md「実行環境の前提」)
      - name: Claude Code CLIをインストール
        run: npm install -g @anthropic-ai/claude-code

      - name: 実行日(JST)を算出
        id: date
        run: echo "value=$(TZ='Asia/Tokyo' date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: 作業用ブランチを作成
        run: git checkout -b "ai-dev-digest/articles/${{ steps.date.outputs.value }}"

      - name: 候補収集・採用基準判定(content-selection)
        run: npx tsx scripts/ai-dev-digest/collect-and-select.ts "${{ steps.date.outputs.value }}" > /tmp/selection.json
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      # 候補不足時はブランチ・PRを作成せずスキップする(requirements.md#掲載件数の保証-1、
      # content-selection/requirements.md#1日の掲載件数-10参照)
      - name: 候補不足によるスキップ判定
        id: selection
        run: |
          status=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/selection.json','utf8')).status)")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = "skipped" ]; then
            reason=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/selection.json','utf8')).reason)")
            echo "候補不足によりスキップします: $reason"
          else
            # PR本文に載せる選定件数・基準未達件数(design.md「PRを作成しCIの結果を待つ処理」手順1)
            topicsCount=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/selection.json','utf8')).topics.length)")
            belowCriteriaCount=$(node -e "const r=JSON.parse(require('fs').readFileSync('/tmp/selection.json','utf8'));console.log(r.topics.filter((t) => t.belowCriteria).length)")
            echo "topicsCount=$topicsCount" >> "$GITHUB_OUTPUT"
            echo "belowCriteriaCount=$belowCriteriaCount" >> "$GITHUB_OUTPUT"
          fi

      # Anthropic APIの従量課金ではなく、運営者個人のClaude Code Pro/Maxサブスクリプション認証
      # (CLAUDE_CODE_OAUTH_TOKEN)でヘッドレス実行する(2026-08第2次改定。design.md「実行環境の前提」参照)
      - name: 翻訳・要約の生成(content-generation)
        if: steps.selection.outputs.status == 'ok'
        run: npx tsx scripts/ai-dev-digest/generate-content.ts /tmp/selection.json > /tmp/topics.json
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: 記事データの組み立て・書き出し
        if: steps.selection.outputs.status == 'ok'
        run: npx tsx scripts/ai-dev-digest/write-article.ts "${{ steps.date.outputs.value }}" /tmp/topics.json

      - name: コミット・push・PR作成・自動マージ有効化
        if: steps.selection.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ secrets.AI_DEV_DIGEST_GH_PAT }}
        run: |
          git config user.name "ai-dev-digest-bot"
          git config user.email "ai-dev-digest-bot@users.noreply.github.com"
          git add "content/ai-dev-digest/articles/${{ steps.date.outputs.value }}.json"
          git commit -m "content(ai-dev-digest): ${{ steps.date.outputs.value }}のダイジェストを公開"
          git push origin "ai-dev-digest/articles/${{ steps.date.outputs.value }}"
          gh pr create --base main \
            --title "[ai-dev-digest] ${{ steps.date.outputs.value }}のダイジェストを公開" \
            --body "日次自動生成PRです。選定件数: ${{ steps.selection.outputs.topicsCount }}件(うち基準未達: ${{ steps.selection.outputs.belowCriteriaCount }}件)。CIが成功すると人間の承認なしに自動的にmainへマージされます(specs/ai-dev-digest/daily-publish/design.md参照)。"
          gh pr merge --auto --squash "ai-dev-digest/articles/${{ steps.date.outputs.value }}"

  # daily-publishが作成したPRのCI(ci.yml)が失敗した場合、マージせず原因をPRコメントに記録する
  # (design.md「CI失敗時に記録する処理」)。ai-dev-digest/articles/**ブランチ由来のPR以外は対象外
  record-ci-failure:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && startsWith(github.event.workflow_run.head_branch, 'ai-dev-digest/articles/')
    runs-on: ubuntu-latest
    # リポジトリ既定のworkflow permissions(現状read)が将来変わっても、失敗ジョブ・ステップ特定
    # (gh run view --json jobs)に必要な読み取り権限を確実に持てるよう明示する
    permissions:
      actions: read
    steps:
      # どのチェックが失敗したかを特定する(design.md「CI失敗時に記録する処理」手順2)。
      # actions:readで足りる読み取り専用の問い合わせのため、書き込み専用のAI_DEV_DIGEST_GH_PATではなく
      # 既定のGITHUB_TOKEN(同一リポジトリのActions実行結果を読む既定権限を持つ)を使う
      - name: 失敗したジョブ・ステップを特定
        id: failure-detail
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          detail=$(gh run view "${{ github.event.workflow_run.id }}" --repo "${{ github.repository }}" --json jobs \
            --jq '[.jobs[] | select(.conclusion=="failure") as $job | $job.steps[] | select(.conclusion=="failure") | "\($job.name) > \(.name)"] | join(", ")')
          if [ -z "$detail" ]; then
            detail="(失敗ステップの詳細は取得できませんでした)"
          fi
          echo "detail=$detail" >> "$GITHUB_OUTPUT"

      - name: 失敗したPRにコメントを追記
        env:
          GH_TOKEN: ${{ secrets.AI_DEV_DIGEST_GH_PAT }}
        run: |
          PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" \
            --head "${{ github.event.workflow_run.head_branch }}" \
            --state open --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
              --body "CI(${{ github.event.workflow_run.name }})が失敗しました。失敗したチェック: ${{ steps.failure-detail.outputs.detail }}。マージは行われません。詳細: ${{ github.event.workflow_run.html_url }}"
          else
            echo "対象のPRが見つかりませんでした(既にクローズ済みの可能性があります): ${{ github.event.workflow_run.head_branch }}"
          fi
