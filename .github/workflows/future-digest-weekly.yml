# 週刊未来予測の週次記事生成・公開ワークフロー
# (仕様: specs/future-digest/weekly-publish/design.md「実行環境の前提」「配信日を求める処理」
# 「1回分の記事を生成する処理」「利用上限への到達時に再実行する処理」「PRを作成しCIの結果を待つ処理」
# 「PRを自動マージする処理」「CI失敗時に記録する処理」「収集失敗を運営者に警告する処理」「セキュリティ」)
#
# publishジョブ: 木曜07:43 JST(本番cron)、または利用上限への到達で打ち切られた回を最大3回まで
# 自動的に再試行する再実行cron(木曜19:43・金曜07:43・金曜19:43 JST)、もしくは手動のworkflow_dispatchで
# 起動する。候補収集・選定(content-selection)→見出し・本文生成(content-generation)→記事データ組み立て→
# PR作成→auto-merge有効化までを行う。future-digest/articles/**ブランチからのPRに限り、CIが成功すると
# 人間の承認なしに自動マージされる(trend-digestのweekly-publishと同じ例外運用)
#
# record-ci-failureジョブ: 上記PRのCI(ci.yml)が失敗した場合、マージせず原因をPRコメントに記録する
name: 週刊未来予測 週次記事公開

on:
  schedule:
    # 毎時0分は世界中のscheduled workflowが集中し起動遅延が大きくなるため、0分を避けた43分に設定する
    # (ai-dev-digest・trend-digestと同じ)。ai-dev-digestの日次実行(06:43 JST)と1時間ずらす
    - cron: '43 22 * * 3' # 水曜22:43 UTC = 木曜07:43 JST(本番)
    - cron: '43 10 * * 4' # 木曜10:43 UTC = 木曜19:43 JST(本番の12時間後の再実行)
    - cron: '43 22 * * 4' # 木曜22:43 UTC = 金曜07:43 JST(本番の24時間後の再実行)
    - cron: '43 10 * * 5' # 金曜10:43 UTC = 金曜19:43 JST(本番の36時間後の再実行)
  workflow_dispatch: # (a) Secrets設定後の動作確認、(b) 3回の自動再実行でも公開できなかった回の復旧、の2用途
    inputs:
      scheduled_publish_date:
        description: '本来の配信日(YYYY-MM-DD、木曜、JST)。省略時は実行日時から自動算出する'
        required: false
        type: string
  workflow_run:
    workflows: ['CI']
    types: [completed]

jobs:
  publish:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      # GitHub書き込みは既定のGITHUB_TOKENではなく専用PATを使う(既定トークンで作成したPR・pushは
      # 無限ループ防止のGitHub側の仕様により後続ワークフロー(ci.yml)が自動起動されないため)。
      # shouldSkipRetryが記事ファイルの有無を確認するために必要なため、スキップ判定より先に行う
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.FUTURE_DIGEST_GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # ci.yml・deploy.ymlと同じバージョンに揃える
          cache: 'npm'

      - run: npm ci

      # workflow_dispatchの入力がシェルインジェクションに使われないよう、run:に直接埋め込まず
      # env:経由でステップに渡す(design.md「セキュリティ」)。入力があればvalidateScheduledPublishDateで
      # 検証したうえで優先し、なければgetScheduledPublishDateで実行日時(UTC)から求める
      # (design.md「配信日を求める処理」)
      - name: 配信日を算出
        id: date
        env:
          SCHEDULED_PUBLISH_DATE_INPUT: ${{ github.event.inputs.scheduled_publish_date }}
        run: |
          value=$(npx tsx -e "
            import { getScheduledPublishDate, validateScheduledPublishDate } from './app/future-digest/lib/scheduledPublishDate'
            const input = process.env.SCHEDULED_PUBLISH_DATE_INPUT
            if (input) {
              if (!validateScheduledPublishDate(input)) {
                console.error('scheduled_publish_dateの形式(YYYY-MM-DD)が不正、または実在する木曜日(JST)ではありません: ' + input)
                process.exit(1)
              }
              console.log(input)
            } else {
              console.log(getScheduledPublishDate(new Date()))
            }
          ")
          echo "value=$value" >> "$GITHUB_OUTPUT"

      # 3本の再実行cronのいずれかで起動された場合のみ、公開済み・PR存在の冪等チェックを行う
      # (design.md「利用上限への到達時に再実行する処理」手順1〜3)。本番cron・workflow_dispatchは
      # github.event.scheduleが再実行cron式と一致しないため素通りする
      - name: 再実行時の冪等チェック(公開済み・PRの有無を確認)
        id: idempotency
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 読み取りだけのため既定トークンで足りる
        run: |
          schedule="${{ github.event.schedule }}"
          if [ "$schedule" = "43 10 * * 4" ] || [ "$schedule" = "43 22 * * 4" ] || [ "$schedule" = "43 10 * * 5" ]; then
            is_retry=true
          else
            is_retry=false
          fi

          if [ "$is_retry" != "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          date="${{ steps.date.outputs.value }}"

          published=$(npx tsx -e "
            import { getAllArticles } from './app/future-digest/lib/articles'
            import { shouldSkipRetry } from './app/future-digest/lib/shouldSkipRetry'
            console.log(shouldSkipRetry(getAllArticles(), '$date'))
          ")
          if [ "$published" = "true" ]; then
            echo "配信日 $date の記事は既に公開済みのため、この再実行はスキップします"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_count=$(gh pr list --repo "${{ github.repository }}" \
            --head "future-digest/articles/$date" \
            --state all --json number --jq 'length')
          if [ "$pr_count" -gt 0 ]; then
            echo "配信日 $date のPRが既に存在するため、この再実行はスキップします"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      # 収集・選定・生成がヘッドレス起動するために必要(design.md「実行環境の前提」)。
      # 冪等チェックでスキップする回は不要なインストールを避ける
      - name: Claude Code CLIをインストール
        if: steps.idempotency.outputs.skip != 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: 作業用ブランチを作成
        if: steps.idempotency.outputs.skip != 'true'
        run: git checkout -b "future-digest/articles/${{ steps.date.outputs.value }}"

      # 選定の最後にshouldAlertOperatorの判定結果をGITHUB_OUTPUTのalertへ書き出す(design.md
      # 「1回分の記事を生成する処理」手順2)。利用上限への到達を検知した場合はこのステップが
      # 非ゼロ終了し、後続のステップは実行されない(この回は打ち切り、次の再実行cronに委ねる)
      - name: 候補収集・選定(content-selection)
        if: steps.idempotency.outputs.skip != 'true'
        id: selection
        run: npx tsx scripts/future-digest/collect-and-select.ts "${{ steps.date.outputs.value }}" > /tmp/selection.json
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: 選定結果の集計(PR本文・ログ用)
        if: steps.idempotency.outputs.skip != 'true'
        id: selection-summary
        run: |
          node -e "
            const fs = require('fs');
            const s = JSON.parse(fs.readFileSync('/tmp/selection.json', 'utf8'));
            const selected = s.slots.filter((x) => x.status === 'selected').length;
            const noCandidate = s.slots.filter((x) => x.status === 'no-candidate').length;
            const collectionFailed = s.slots.filter((x) => x.status === 'collection-failed').length;
            const out = [
              'issueNumber=' + s.issueNumber,
              'horizons=' + s.horizons.join('、'),
              'selectedCount=' + selected,
              'noCandidateCount=' + noCandidate,
              'collectionFailedCount=' + collectionFailed,
            ].join('\n') + '\n';
            fs.appendFileSync(process.env.GITHUB_OUTPUT, out);
          "

      # 採用件数にかかわらず(0件でも)常に実行する。公開をスキップする分岐はない
      # (design.md「1回分の記事を生成する処理」手順3〜4)。利用上限への到達を検知した場合は
      # このステップが非ゼロ終了し、後続のwrite-article.tsには進まない
      - name: 見出し・本文の生成(content-generation)
        if: steps.idempotency.outputs.skip != 'true'
        run: npx tsx scripts/future-digest/generate-content.ts /tmp/selection.json > /tmp/generation.json
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      # 同じ配信日の記事ファイルが既にある場合は上書きせず非ゼロ終了する(write-article.ts)
      - name: 記事データの組み立て・書き出し
        if: steps.idempotency.outputs.skip != 'true'
        run: npx tsx scripts/future-digest/write-article.ts /tmp/selection.json /tmp/generation.json

      - name: コミット・push・PR作成・自動マージ有効化
        if: steps.idempotency.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.FUTURE_DIGEST_GH_PAT }}
        run: |
          date="${{ steps.date.outputs.value }}"
          git config user.name "future-digest-bot"
          git config user.email "future-digest-bot@users.noreply.github.com"
          git add "content/future-digest/articles/$date.json"
          git commit -m "content(future-digest): ${date}を公開"
          git push origin "future-digest/articles/$date"
          gh pr create --base main \
            --title "[future-digest] ${date}を公開" \
            --body "週次自動生成PRです(回数: ${{ steps.selection-summary.outputs.issueNumber }} / 時間軸: ${{ steps.selection-summary.outputs.horizons }})。採用件数: ${{ steps.selection-summary.outputs.selectedCount }}件 / 候補なし: ${{ steps.selection-summary.outputs.noCandidateCount }}件 / 収集失敗: ${{ steps.selection-summary.outputs.collectionFailedCount }}件。CIが成功すると人間の承認なしに自動的にmainへマージされます(specs/future-digest/weekly-publish/design.md参照)。"
          gh pr merge --auto --squash "future-digest/articles/$date"

      # 全枠(有効なジャンル数×2時間軸)が収集失敗だった回は、記事は公開したうえでこのジョブを
      # 失敗表示にする(design.md「収集失敗を運営者に警告する処理」)
      - name: 全枠収集失敗を運営者に警告(公開後にジョブを失敗表示にする)
        if: steps.idempotency.outputs.skip != 'true' && steps.selection.outputs.alert == 'true'
        run: |
          echo "::error::全枠(有効なジャンル数×2時間軸)で収集が失敗しました。収集の仕組み自体に問題が起きている可能性があります。記事は公開済みです(上記PR作成ステップ参照)。"
          exit 1

  # publishが作成したPRのCI(ci.yml)が失敗した場合、マージせず原因をPRコメントに記録する
  # (design.md「CI失敗時に記録する処理」)。future-digest/articles/**ブランチ由来のPR以外は対象外
  # (source-reviewが作成するfuture-digest/source-review/**ブランチのPRは通常どおりレビュー必須のまま残す。
  # design.md「PRを自動マージする処理」参照)
  record-ci-failure:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && startsWith(github.event.workflow_run.head_branch, 'future-digest/articles/')
    runs-on: ubuntu-latest
    # リポジトリ既定のworkflow permissions(現状read)が将来変わっても、失敗ジョブ・ステップ特定
    # (gh run view --json jobs)に必要な読み取り権限を確実に持てるよう明示する
    permissions:
      actions: read
    steps:
      # どのチェックが失敗したかを特定する(design.md「CI失敗時に記録する処理」手順2)。
      # actions:readで足りる読み取り専用の問い合わせのため、書き込み専用のFUTURE_DIGEST_GH_PATではなく
      # 既定のGITHUB_TOKEN(同一リポジトリのActions実行結果を読む既定権限を持つ)を使う
      - name: 失敗したジョブ・ステップを特定
        id: failure-detail
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          detail=$(gh run view "${{ github.event.workflow_run.id }}" --repo "${{ github.repository }}" --json jobs \
            --jq '[.jobs[] | select(.conclusion=="failure") as $job | $job.steps[] | select(.conclusion=="failure") | "\($job.name) > \(.name)"] | join(", ")')
          if [ -z "$detail" ]; then
            detail="(失敗ステップの詳細は取得できませんでした)"
          fi
          echo "detail=$detail" >> "$GITHUB_OUTPUT"

      - name: 失敗したPRにコメントを追記
        env:
          GH_TOKEN: ${{ secrets.FUTURE_DIGEST_GH_PAT }}
        run: |
          PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" \
            --head "${{ github.event.workflow_run.head_branch }}" \
            --state open --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
              --body "CI(${{ github.event.workflow_run.name }})が失敗しました。失敗したチェック: ${{ steps.failure-detail.outputs.detail }}。マージは行われません。詳細: ${{ github.event.workflow_run.html_url }}"
          else
            echo "対象のPRが見つかりませんでした(既にクローズ済みの可能性があります): ${{ github.event.workflow_run.head_branch }}"
          fi
